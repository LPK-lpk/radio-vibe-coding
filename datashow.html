<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datashow — Rádio LPK</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --green:#00ff88; --red:#ff3366; --gold:#ffd700; --purple:#c084fc; }
    html, body { width:100vw; height:100vh; overflow:hidden; background:#05050d; font-family:'Space Grotesk',sans-serif; color:#fff; cursor:none; }

    /* SLIDESHOW */
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity 1.4s ease; }
    .slide.active { opacity:1; }

    /* VÍDEO */
    #videoEl { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
    #iframeEl { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; pointer-events:none; }

    /* FUNDO PADRÃO */
    .bg-default { position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 40%, rgba(0,255,136,.06), transparent 70%); }
    .grid-bg { position:absolute; inset:0; background-image:linear-gradient(rgba(0,255,136,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.03) 1px,transparent 1px); background-size:60px 60px; animation:gs 25s linear infinite; }
    @keyframes gs { from{background-position:0 0} to{background-position:60px 60px} }

    /* OVERLAY */
    .img-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.15) 40%, transparent 100%); display:none; }

    /* BARRA INFERIOR */
    .bottom-bar { position:absolute; bottom:0; left:0; right:0; height:80px; background:rgba(0,0,0,.78); border-top:1px solid rgba(0,255,136,.2); backdrop-filter:blur(16px); display:flex; align-items:center; padding:0 40px; gap:24px; z-index:10; }
    .bar-station { display:flex; align-items:center; gap:12px; border-right:1px solid rgba(255,255,255,.1); padding-right:24px; flex-shrink:0; }
    .bar-pulse { width:10px; height:10px; border-radius:50%; background:var(--red); animation:blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .bar-name { font-size:1rem; font-weight:700; }
    .bar-name span { color:var(--green); }
    .bar-song { flex:1; display:flex; align-items:center; gap:12px; overflow:hidden; }
    .bar-label { font-size:.7rem; color:var(--green); letter-spacing:2px; text-transform:uppercase; white-space:nowrap; }
    .bar-title { font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bar-artist { font-size:.8rem; color:rgba(255,255,255,.5); white-space:nowrap; }
    .bar-wave { display:flex; align-items:center; gap:2px; height:24px; flex-shrink:0; }
    .bw { width:3px; border-radius:2px; background:var(--green); animation:bwv var(--d,.6s) ease-in-out infinite alternate; animation-delay:var(--dl,0s); }
    @keyframes bwv { from{height:3px} to{height:24px} }

    /* LEGENDA */
    .legenda { position:absolute; bottom:90px; left:0; right:0; text-align:center; font-size:1.1rem; color:rgba(255,255,255,.7); padding:0 60px; z-index:10; text-shadow:0 2px 8px rgba(0,0,0,.8); transition:opacity .5s; }

    /* CONTADOR SLIDES */
    .slide-counter { position:absolute; top:24px; right:40px; font-family:'JetBrains Mono',monospace; font-size:.8rem; color:rgba(255,255,255,.25); z-index:10; }

    /* RELÓGIO */
    .relogio { position:absolute; top:24px; left:40px; font-family:'JetBrains Mono',monospace; font-size:1rem; color:rgba(255,255,255,.25); z-index:10; }

    /* TÍTULO EVENTO */
    .titulo-evento { position:absolute; top:56px; left:50%; transform:translateX(-50%); font-size:1rem; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,.35); z-index:10; white-space:nowrap; }

    /* MODO HOMENAGEM */
    #modoHomenagem { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20; background:linear-gradient(135deg,#0a0015 0%,#05050d 50%,#0a1500 100%); text-align:center; padding:40px; }
    #modoHomenagem.ativo { display:flex; }
    #confete { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:25; }
    .cp { position:absolute; width:8px; height:8px; border-radius:2px; animation:cf linear infinite; }
    @keyframes cf { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
    .hom-badge { font-size:.8rem; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:var(--gold); border:1px solid rgba(255,215,0,.3); border-radius:99px; padding:8px 24px; margin-bottom:32px; animation:gg 2s ease-in-out infinite; }
    @keyframes gg { 0%,100%{box-shadow:0 0 10px rgba(255,215,0,.2)} 50%{box-shadow:0 0 30px rgba(255,215,0,.5)} }
    .hom-emoji { font-size:6rem; margin-bottom:16px; animation:bounce 1s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .hom-title { font-size:clamp(1.5rem,4vw,2.5rem); font-weight:300; color:rgba(255,255,255,.7); letter-spacing:4px; text-transform:uppercase; margin-bottom:16px; }
    .hom-name { font-size:clamp(4rem,12vw,9rem); font-weight:800; letter-spacing:-2px; line-height:.9; color:var(--gold); text-shadow:0 0 60px rgba(255,215,0,.4); margin-bottom:24px; animation:ng 3s ease-in-out infinite; }
    @keyframes ng { 0%,100%{text-shadow:0 0 40px rgba(255,215,0,.3)} 50%{text-shadow:0 0 80px rgba(255,215,0,.6),0 0 120px rgba(255,215,0,.3)} }
    .hom-musica { font-size:clamp(1rem,2vw,1.4rem); color:rgba(255,255,255,.5); font-family:'JetBrains Mono',monospace; }
    .hom-musica span { color:var(--green); }
  </style>
</head>
<body>

  <div class="bg-default"></div>
  <div class="grid-bg"></div>
  <div id="slidesContainer"></div>
  <video id="videoEl" autoplay loop muted playsinline></video>
  <iframe id="iframeEl" allowfullscreen></iframe>
  <div class="img-overlay" id="imgOverlay"></div>

  <div class="relogio" id="relogio"></div>
  <div class="titulo-evento" id="tituloEvento"></div>
  <div class="slide-counter" id="slideCounter"></div>
  <div class="legenda" id="legenda"></div>

  <div id="modoHomenagem">
    <div id="confete"></div>
    <div class="hom-badge">✨ Homenagem Especial ✨</div>
    <div class="hom-emoji">🎂</div>
    <div class="hom-title">Feliz Aniversário</div>
    <div class="hom-name" id="homNome">—</div>
    <div class="hom-musica">🎵 <span id="homMusica">—</span></div>
  </div>

  <div class="bottom-bar">
    <div class="bar-station">
      <div class="bar-pulse"></div>
      <div class="bar-name">Rádio <span>LPK</span></div>
    </div>
    <div class="bar-song">
      <span class="bar-label">🎵 agora</span>
      <span class="bar-title" id="barTitle">Aguardando...</span>
      <span class="bar-artist" id="barArtist"></span>
    </div>
    <div class="bar-wave" id="barWave"></div>
  </div>

<script>
  // ── CONFIG ─────────────────────────────────────
  const SUPA      = 'https://kbctgevxkatxayldpwja.supabase.co';
  const KEY       = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiY3RnZXZ4a2F0eGF5bGRwd2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDUyNDMsImV4cCI6MjEwMTcyMTI0M30.BpeBpSdwhoKxwx4xAj4hMg7ZftqNtJhKlBS2hx3mqDo';
  const SHEETS_CSV = 'https://docs.google.com/spreadsheets/d/1h8zIrgyvpRsQgqj_hFAroA5GZYrhxRCflO_h55Fg8gs/gviz/tq?tqx=out:csv&sheet=Datashow';
  const INTERVAL_DEFAULT = 6; // segundos entre slides

  // Waveform
  const bwEl = document.getElementById('barWave');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div'); b.className = 'bw';
    b.style.setProperty('--d', (.3 + Math.random() * .5) + 's');
    b.style.setProperty('--dl', (Math.random() * .4) + 's');
    bwEl.appendChild(b);
  }

  // Relógio
  function tick() {
    const n = new Date();
    document.getElementById('relogio').textContent =
      n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
  }
  tick(); setInterval(tick, 10000);

  // ── GOOGLE DRIVE → URL direta ─────────────────
  function converterDriveUrl(url) {
    if (!url) return url;
    // https://drive.google.com/file/d/FILE_ID/view
    const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1) return 'https://drive.google.com/thumbnail?id=' + m1[1] + '&sz=w1280';
    // https://drive.google.com/open?id=FILE_ID
    const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2) return 'https://drive.google.com/thumbnail?id=' + m2[1] + '&sz=w1280';
    return url;
  }

  function driveEmbedUrl(url) {
    const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
    return url;
  }

  function isDrive(url) { return url && url.includes('drive.google.com'); }
  function isVideo(tipo, url) {
    return tipo === 'video' || (url && (url.match(/\.(mp4|webm|ogg)$/i)));
  }

  // ── CSV PARSER ────────────────────────────────
  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    return lines.slice(1).map(line => {
      // Parse simples respeitando campos com aspas
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') { inQ = !inQ; continue; }
        if (line[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
        cur += line[i];
      }
      cols.push(cur.trim());
      return {
        url:     cols[0] || '',
        tipo:    (cols[1] || 'imagem').toLowerCase().trim(),
        legenda: cols[2] || '',
        ativo:   (cols[3] || 'SIM').toUpperCase().trim() !== 'NAO'
      };
    }).filter(r => r.url && r.ativo);
  }

  // ── SLIDESHOW ─────────────────────────────────
  let slides = [], currentSlide = 0, slideTimer = null, legendas = [];

  function criarSlides(midias) {
    const container = document.getElementById('slidesContainer');
    container.innerHTML = ''; slides = []; legendas = [];
    const imgs = midias.filter(m => !isVideo(m.tipo, m.url));
    imgs.forEach((m, i) => {
      const el = document.createElement('div');
      el.className = 'slide' + (i === 0 ? ' active' : '');
      const url = isDrive(m.url) ? converterDriveUrl(m.url) : m.url;
      el.style.backgroundImage = 'url(' + url + ')';
      container.appendChild(el);
      slides.push(el);
      legendas.push(m.legenda || '');
    });
    document.getElementById('imgOverlay').style.display = slides.length ? '' : 'none';
    atualizarLegenda();
    atualizarContador();
  }

  function atualizarLegenda() {
    const el = document.getElementById('legenda');
    el.textContent = legendas[currentSlide] || '';
    el.style.opacity = legendas[currentSlide] ? '1' : '0';
  }

  function atualizarContador() {
    const el = document.getElementById('slideCounter');
    el.textContent = slides.length > 1 ? (currentSlide + 1) + ' / ' + slides.length : '';
  }

  function avancarSlide() {
    if (slides.length < 2) return;
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
    atualizarLegenda(); atualizarContador();
  }

  function iniciarSlideshow(midias, interval) {
    criarSlides(midias);
    clearInterval(slideTimer);
    if (slides.length > 1) slideTimer = setInterval(avancarSlide, (interval || INTERVAL_DEFAULT) * 1000);
  }

  function mostrarVideo(url, tipo) {
    const videoEl  = document.getElementById('videoEl');
    const iframeEl = document.getElementById('iframeEl');
    clearInterval(slideTimer);
    document.getElementById('slidesContainer').innerHTML = '';
    document.getElementById('imgOverlay').style.display = 'none';

    if (isDrive(url)) {
      videoEl.style.display   = 'none';
      iframeEl.src            = driveEmbedUrl(url);
      iframeEl.style.display  = 'block';
    } else {
      iframeEl.style.display  = 'none';
      videoEl.src             = url;
      videoEl.style.display   = 'block';
    }
  }

  // ── CONFETE ───────────────────────────────────
  const cores = ['#ffd700','#ff3366','#00ff88','#c084fc','#38bdf8','#fb923c'];
  function iniciarConfete() {
    const c = document.getElementById('confete'); c.innerHTML = '';
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div'); p.className = 'cp';
      p.style.left            = Math.random() * 100 + 'vw';
      p.style.background      = cores[Math.floor(Math.random() * cores.length)];
      p.style.width           = (6 + Math.random() * 8) + 'px';
      p.style.height          = (6 + Math.random() * 8) + 'px';
      p.style.animationDuration = (3 + Math.random() * 4) + 's';
      p.style.animationDelay  = -(Math.random() * 4) + 's';
      c.appendChild(p);
    }
  }

  // ── HOMENAGEM ─────────────────────────────────
  let modoAtual = 'normal';
  function ativarHomenagem(h) {
    if (modoAtual === 'homenagem') return;
    modoAtual = 'homenagem';
    document.getElementById('homNome').textContent   = h.aniversariante || '—';
    document.getElementById('homMusica').textContent = h.titulo_musica   || '—';
    document.getElementById('modoHomenagem').classList.add('ativo');
    iniciarConfete();
  }
  function desativarHomenagem() {
    if (modoAtual === 'normal') return;
    modoAtual = 'normal';
    document.getElementById('modoHomenagem').classList.remove('ativo');
    document.getElementById('confete').innerHTML = '';
  }

  // ── FETCH SUPABASE ────────────────────────────
  async function supaGet(table, params = '') {
    try {
      const r = await fetch(SUPA + '/rest/v1/' + table + '?' + params, {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
      });
      return r.json();
    } catch(e) { return null; }
  }

  // ── FETCH GOOGLE SHEETS ───────────────────────
  let lastSheetHash = '';
  async function buscarSheets() {
    try {
      const r = await fetch(SHEETS_CSV + '&t=' + Date.now());
      if (!r.ok) return null;
      const text = await r.text();
      if (text === lastSheetHash) return 'sem_mudanca';
      lastSheetHash = text;
      return parseCSV(text);
    } catch(e) { return null; }
  }

  // ── LOOP PRINCIPAL ────────────────────────────
  let midia_atual = null;

  async function atualizar() {
    // Supabase: música e homenagem
    const config = await supaGet('radio_config', 'id=eq.1&select=musica_atual,artista_atual');
    if (config && config[0]) {
      document.getElementById('barTitle').textContent  = config[0].musica_atual  || 'Aguardando...';
      document.getElementById('barArtist').textContent = config[0].artista_atual || '';
    }

    const hom = await supaGet('radio_homenagens', 'status=eq.tocando&select=aniversariante,titulo_musica&limit=1');
    if (hom && hom.length > 0) { ativarHomenagem(hom[0]); }
    else { desativarHomenagem(); }

    // Google Sheets: mídias
    const midias = await buscarSheets();
    if (!midias || midias === 'sem_mudanca') return;

    // Separar vídeos e imagens
    const videos = midias.filter(m => isVideo(m.tipo, m.url));
    const imgs   = midias.filter(m => !isVideo(m.tipo, m.url));

    if (videos.length > 0) {
      // Prioridade: vídeo
      const v = videos[0];
      const key = 'video:' + v.url;
      if (midia_atual !== key) { midia_atual = key; mostrarVideo(v.url, v.tipo); }
    } else if (imgs.length > 0) {
      // Slideshow de imagens
      iniciarSlideshow(imgs, INTERVAL_DEFAULT);
      document.getElementById('videoEl').style.display  = 'none';
      document.getElementById('iframeEl').style.display = 'none';
    } else {
      // Sem mídia
      clearInterval(slideTimer);
      document.getElementById('slidesContainer').innerHTML = '';
      document.getElementById('videoEl').style.display  = 'none';
      document.getElementById('iframeEl').style.display = 'none';
      document.getElementById('imgOverlay').style.display = 'none';
    }

    // Título do evento (coluna E opcional)
    // Usa primeira linha não vazia da coluna legenda como título de evento se configurado
  }

  // Tela cheia ao clicar
  document.body.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  });

  atualizar();
  setInterval(atualizar, 30000); // atualiza a cada 30s
</script>
</body>
</html>
